<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#110f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeiterfassung">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Zeiterfassung</title>
<style>
:root{--bg:#0e0c1a;--panel:#110f1f;--card:#181428;--border:#2a2542;--fg:#ece8f7;--muted:#9a92b3;--accent:#8b5cf6;--accent-fg:#fff;--ok:#2ea36b;--warn:#d9a441;--bad:#d9576b;
  --soft:color-mix(in srgb,var(--card) 70%,var(--border));--accent-soft:color-mix(in srgb,var(--card) 70%,var(--accent));--planned:color-mix(in srgb,var(--card) 60%,var(--accent))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#main{flex:1;overflow-y:auto;padding:16px 14px 24px;-webkit-overflow-scrolling:touch}
#nav{display:flex;background:var(--panel);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 11px;font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--accent)}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.cap{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center}.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.grid2 .card{margin:0}
.val{font-size:24px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.stamp{display:flex;gap:12px;align-items:center}
.ringwrap{position:relative;width:150px;height:150px;flex:none}
.ringwrap svg{width:150px;height:150px;transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font-size:26px;font-variant-numeric:tabular-nums}
.ctl{flex:1;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:11px 8px;margin-top:7px;font:700 15px system-ui;color:#fff;background:var(--soft)}
.btn:active{filter:brightness(1.2)}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn);color:#1a1a1a}.btn.bad{background:var(--bad)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}.btn.ghost{background:var(--soft);color:var(--fg)}
.btn[disabled]{background:var(--soft);color:var(--muted);opacity:.55}
.btn.inline{display:inline-block;width:auto;padding:9px 14px;margin:0;font-size:13px}
.link{color:var(--muted);font-size:13px;margin-top:10px;display:inline-block}
.fe{display:flex;align-items:center;gap:14px;margin:10px 0 4px}
.fe .big{font-size:40px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.fe b{font-size:16px}
.sep{height:1px;background:var(--border);margin:12px 0}
.chips{display:flex;gap:8px;margin-top:8px}
.chip{flex:1;text-align:center}
.chip .c{background:var(--soft);color:var(--muted);border:1px solid var(--soft);border-radius:9px;padding:9px 0;font-weight:700}
.chip.sel .c{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.chip .u{font-size:11px;color:var(--muted);margin-top:4px}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
#tl{width:100%;height:84px;display:block;margin-top:6px}
/* Verlauf */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:17px}.mnav button{width:42px;height:38px;border:0;border-radius:10px;background:var(--soft);color:var(--fg);font-size:20px}
.acts{display:flex;gap:8px;margin-bottom:12px}.acts .btn{margin:0;flex:1;padding:10px 4px;font-size:13px}
.wk{display:flex;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:12px 0 6px;font-weight:700;font-size:13px}
.day{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--border)}
.day .l b{display:block;font-size:15px}.day .l span{font-size:12px;color:var(--muted)}
.day .r{text-align:right}.day .r b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.day .r span{font-size:12px}
.day.urlaub .l b{color:var(--accent)}.day.we{opacity:.7}.day.open .l span{color:var(--warn)}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sums .card{margin:0;padding:10px 12px}.sums .val{font-size:18px}
/* Einstellungen */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
.theme{border-radius:12px;padding:10px;border:2px solid var(--border)}.theme.sel{border-color:var(--accent)}
.theme b{font-size:13px}.sw{display:flex;gap:4px;margin-top:7px}.sw i{width:20px;height:20px;border-radius:4px}
label.f{display:block;margin:10px 0 4px;color:var(--muted);font-size:12px}
input,select{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:11px;font:16px system-ui;color-scheme:dark}
input:focus,select:focus{outline:0;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;margin:12px 0;color:var(--fg)}.chk input{width:20px;height:20px;padding:0}
h3{margin:18px 0 4px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
/* Sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
#ov.on{display:flex}
#sheet{background:var(--bg);border-top:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-height:92%;overflow-y:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 6px;font-size:18px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.btns{display:flex;gap:10px;margin-top:10px}.btns .btn{margin:0}
.hint{font-size:11px;color:var(--muted);margin-top:3px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="main"></div>
<nav id="nav">
  <button data-p="heute"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Heute</button>
  <button data-p="verlauf"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Verlauf</button>
  <button data-p="einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.3 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>Mehr</button>
</nav>
<div id="ov"><div id="sheet"></div></div>
<div id="toast"></div>
<script src="version.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
